# Overrides /usr/share/sway/config.d/90-swayidle.conf
# Explicit config path so colors always apply; timeouts via $lock_timeout / $screen_timeout

exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT "swaylock -f -C $HOME/.config/swaylock/config" \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"' \
        timeout $ST 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power on"' \
        before-sleep "swaylock -f -C $HOME/.config/swaylock/config" \
        lock "swaylock -f -C $HOME/.config/swaylock/config" \
        unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'

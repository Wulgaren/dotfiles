# Publishes the nvim/ folder to a separate GitHub repo (history for that subtree only).
#
# One-time repo setup:
#   1) Create an EMPTY public repo (e.g. yourname/neovim-config).
#   2) Settings → Secrets and variables → Actions:
#        Secret  NVIM_PUBLIC_REPO_TOKEN → fine‑grained or classic PAT with
#               "Contents: Read and write" on the target repo ONLY.
#        Variable NEOVIM_PUBLIC_REPO_SLUG → owner/repo  (example: YOUR_LOGIN/neovim-config)

name: Publish nvim subtree

on:
  push:
    branches:
      - main
    paths:
      - 'nvim/**'
  workflow_dispatch:

concurrency:
  group: sync-nvim-public
  cancel-in-progress: true

jobs:
  subtree-split-push:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials=false: checkout stores GITHUB_TOKEN for github.com; without this,
      # git push would reuse that token and ignore PAT in remote URL → 403 on other repos.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split nvim/ and push to public repo
        env:
          SRC_BRANCH: ${{ github.ref_name }}
          DEST_SLUG: ${{ vars.NEOVIM_PUBLIC_REPO_SLUG }}
          TOKEN: ${{ secrets.NVIM_PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DEST_SLUG:-}" ]]; then
            echo "::error::Repo variable NEOVIM_PUBLIC_REPO_SLUG is empty (expected owner/repo, e.g. octocat/neovim-config)."
            exit 1
          fi
          if [[ -z "${TOKEN:-}" ]]; then
            echo "::error::Secret NVIM_PUBLIC_REPO_TOKEN is empty. Use a PAT with contents:write on ${DEST_SLUG}."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Splitting subtree nvim/ from branch ${SRC_BRANCH} …"
          REV="$(git subtree split --prefix=nvim "${SRC_BRANCH}")"
          echo "Pushing ${REV} → ${DEST_SLUG}:main"
          git push --force "https://x-access-token:${TOKEN}@github.com/${DEST_SLUG}.git" "${REV}:refs/heads/main"
